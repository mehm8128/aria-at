<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <title>Link with Image and Text Example</title>
</head>

<body>
  <main>
    <h1>Link with Image and Text Example</h1>
    <p>
      The below example demonstrates a link containing an image (with alternative text) and text.
    </p>
    <section>
      <div class="example-header">
        <h2 id="ex_label">Example</h2>
      </div>
      <div role="separator" id="ex_start_sep" aria-labelledby="ex_start_sep ex_label" aria-label="Start of"></div>
      <div id="ex1">
        <a id="beforelink" href="#beforelink">Navigate forwards from here</a>
        <div>
          <a id="targetlink" href="https://waic.jp/">
            <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMzQiIGhlaWdodD0iNzciPjwvc3ZnPg==" alt="ウェブアクセシビリティ基盤委員会" height="77" width="334">
            公式サイト
          </a>
        </div>
        <a id="afterlink" href="#afterlink">Navigate backwards from here</a>
      </div>
      <div role="separator" id="ex_end_sep" aria-labelledby="ex_end_sep ex_label" aria-label="End of"></div>
    </section>
  </main>
</body>

</html>
